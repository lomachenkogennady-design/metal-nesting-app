<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metal Nesting App - Раскрой металла</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#11111b',
                            card: '#181825',
                            border: '#313244',
                            text: '#cdd6f4',
                            accent: '#89b4fa',
                            green: '#a6e3a1'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-dark-text min-h-screen p-4 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Заголовок -->
        <header class="bg-dark-card border border-dark-border p-5 rounded-xl shadow-lg flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-dark-accent">🧮 Metal Nesting App</h1>
                <p class="text-sm text-gray-400">Система оптимизации раскроя листового металла</p>
            </div>
            <div class="flex gap-2">
                <label class="cursor-pointer bg-dark-accent text-dark-bg px-4 py-2 rounded-lg font-semibold text-sm hover:opacity-90 transition">
                    📁 Импорт DXF
                    <input type="file" id="dxfFile" accept=".dxf" class="hidden" onchange="uploadDxf(this)">
                </label>
                <button onclick="exportDxf()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-green-500 transition">
                    💾 Скачать DXF
                </button>
            </div>
        </header>

        <!-- Настройки листа и цен -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-dark-card border border-dark-border p-5 rounded-xl shadow-lg space-y-3">
                <h2 class="text-lg font-semibold text-dark-accent">Параметры листа</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400">Ширина (мм)</label>
                        <input type="number" id="sheetW" value="2500" class="w-full bg-dark-bg border border-dark-border p-2 rounded-lg text-white">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">Высота (мм)</label>
                        <input type="number" id="sheetH" value="1250" class="w-full bg-dark-bg border border-dark-border p-2 rounded-lg text-white">
                    </div>
                </div>
            </div>

            <div class="bg-dark-card border border-dark-border p-5 rounded-xl shadow-lg space-y-3">
                <h2 class="text-lg font-semibold text-dark-accent">Ценообразование</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400">Цена за лист (руб)</label>
                        <input type="number" id="priceSheet" value="5000" class="w-full bg-dark-bg border border-dark-border p-2 rounded-lg text-white">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">Цена 1м реза (руб)</label>
                        <input type="number" id="priceMeter" value="50" class="w-full bg-dark-bg border border-dark-border p-2 rounded-lg text-white">
                    </div>
                </div>
            </div>
        </div>

        <!-- Список деталей -->
        <div class="bg-dark-card border border-dark-border p-5 rounded-xl shadow-lg space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-dark-accent">Спецификация деталей</h2>
                <button onclick="addPartRow()" class="bg-dark-border text-white px-3 py-1.5 rounded-lg text-sm hover:bg-opacity-80 transition">+ Добавить деталь</button>
            </div>
            
            <div id="partsList" class="space-y-2">
                <!-- Строка детали по умолчанию -->
                <div class="grid grid-cols-12 gap-2 items-center part-row">
                    <input type="text" placeholder="Имя" value="Деталь 1" class="col-span-4 bg-dark-bg border border-dark-border p-2 rounded-lg text-sm text-white part-id">
                    <input type="number" placeholder="Ширина" value="400" class="col-span-3 bg-dark-bg border border-dark-border p-2 rounded-lg text-sm text-white part-w">
                    <input type="number" placeholder="Высота" value="300" class="col-span-2 bg-dark-bg border border-dark-border p-2 rounded-lg text-sm text-white part-h">
                    <input type="number" placeholder="Кол-во" value="5" class="col-span-2 bg-dark-bg border border-dark-border p-2 rounded-lg text-sm text-white part-qty">
                    <button onclick="this.parentElement.remove()" class="col-span-1 text-red-400 hover:text-red-300 text-center font-bold">×</button>
                </div>
            </div>

            <button onclick="calculateNesting()" class="w-full bg-dark-accent text-dark-bg py-3 rounded-xl font-bold text-center hover:opacity-90 transition shadow-lg">
                Рассчитать раскрой
            </button>
        </div>

        <!-- Результаты -->
        <div id="resultsContainer" class="space-y-6"></div>

    </div>

    <script>
        function addPartRow(id = 'Деталь', w = 300, h = 200, qty = 1) {
            const container = document.getElementById('partsList');
            const row = document.createElement('div');
            row.className = 'grid grid-cols-12 gap-2 items-center part-row';
            row.innerHTML = `
                <input type="text" placeholder="Имя" value="${id}" class="col-span-4 bg-dark-bg border border-dark-border p-2 rounded-lg text-sm text-white part-id">
                <input type="number" placeholder="Ширина" value="${w}" class="col-span-3 bg-dark-bg border border-dark-border p-2 rounded-lg text-sm text-white part-w">
                <input type="number" placeholder="Высота" value="${h}" class="col-span-2 bg-dark-bg border border-dark-border p-2 rounded-lg text-sm text-white part-h">
                <input type="number" placeholder="Кол-во" value="${qty}" class="col-span-2 bg-dark-bg border border-dark-border p-2 rounded-lg text-sm text-white part-qty">
                <button onclick="this.parentElement.remove()" class="col-span-1 text-red-400 hover:text-red-300 text-center font-bold">×</button>
            `;
            container.appendChild(row);
        }

        async function uploadDxf(input) {
            if (!input.files || !input.files[0]) return;
            const formData = new FormData();
            formData.append('file', input.files[0]);

            try {
                const res = await fetch('/api/v1/import/dxf', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.status === 'success' && data.parts) {
                    document.getElementById('partsList.innerHTML') = '';
                    data.parts.forEach(p => {
                        addPartRow(p.id, p.width, p.height, p.quantity);
                    });
                    alert('DXF успешно импортирован!');
                } else {
                    alert('Ошибка импорта: ' + (data.message || 'Неизвестная ошибка'));
                }
            } catch (e) {
                alert('Ошибка соединения с сервером');
            }
        }

        function collectPayload() {
            const parts = [];
            document.querySelectorAll('.part-row').forEach(row => {
                parts.push({
                    id: row.querySelector('.part-id').value || 'Деталь',
                    width: parseFloat(row.querySelector('.part-w').value) || 0,
                    height: parseFloat(row.querySelector('.part-h').value) || 0,
                    quantity: parseInt(row.querySelector('.part-qty').value) || 1
                });
            });

            return {
                sheet: {
                    width: parseFloat(document.getElementById('sheetW').value) || 2500,
                    height: parseFloat(document.getElementById('sheetH').value) || 1250
                },
                gap: 0.8,
                cost_config: {
                    price_per_sheet: parseFloat(document.getElementById('priceSheet').value) || 0,
                    price_per_meter_cut: parseFloat(document.getElementById('priceMeter').value) || 0
                },
                parts: parts
            };
        }

        async function calculateNesting() {
            const payload = collectPayload();
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<p class="text-center text-gray-400">Идет расчет раскроя...</p>';

            try {
                const res = await fetch('/api/v1/nest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="bg-red-900/50 border border-red-500 p-4 rounded-xl text-red-200">Ошибка: ${data.error}</div>`;
                    return;
                }

                let html = `
                    <div class="bg-dark-card border border-dark-border p-5 rounded-xl shadow-lg space-y-2">
                        <h2 class="text-xl font-bold text-dark-accent">Итоги расчёта</h2>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 pt-2">
                            <div class="bg-dark-bg p-3 rounded-lg border border-dark-border">
                                <p class="text-xs text-gray-400">Листов металла</p>
                                <p class="text-lg font-bold text-white">${data.total_sheets}</p>
                            </div>
                            <div class="bg-dark-bg p-3 rounded-lg border border-dark-border">
                                <p class="text-xs text-gray-400">Стоимость металла</p>
                                <p class="text-lg font-bold text-white">${data.cost.metal} ₽</p>
                            </div>
                            <div class="bg-dark-bg p-3 rounded-lg border border-dark-border">
                                <p class="text-xs text-gray-400">Стоимость резки</p>
                                <p class="text-lg font-bold text-white">${data.cost.cutting} ₽</p>
                            </div>
                            <div class="bg-dark-bg p-3 rounded-lg border border-dark-border">
                                <p class="text-xs text-gray-dark-400">Общая стоимость</p>
                                <p class="text-lg font-bold text-dark-green">${data.cost.total} ₽</p>
                            </div>
                        </div>
                    </div>
                `;

                data.sheets.forEach(sheet => {
                    html += `
                        <div class="bg-dark-card border border-dark-border p-5 rounded-xl shadow-lg space-y-3">
                            <div class="flex justify-between items-center">
                                <h3 class="font-semibold text-white">Лист №${sheet.sheet_number}</h3>
                                <span class="text-sm px-2.5 py-1 rounded bg-dark-bg border border-dark-border text-dark-green">Заполнение: ${sheet.utilization_percentage}%</span>
                            </div>
                            <div class="w-full overflow-x-auto rounded-lg border border-dark-border">
                                ${sheet.svg}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (e) {
                container.innerHTML = `<div class="bg-red-900/50 border border-red-500 p-4 rounded-xl text-red-200">Не удалось выполнить запрос к серверу</div>`;
            }
        }

        async function exportDxf() {
            const payload = collectPayload();
            try {
                const res = await fetch('/api/v1/export/dxf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    alert('Ошибка при экспорте DXF');
                    return;
                }
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'nesting_result.dxf';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                alert('Не удалось скачать DXF-файл');
            }
        }
    </script>
</body>
</html>
